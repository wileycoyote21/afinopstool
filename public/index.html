<!doctype html>
<html>
<head>
<meta charset="utf-8">

<title>AMD FinOps Analyzer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body {
  margin:0;
  background:#0b0f14;
  color:#e6edf3;
  font-family:'Inter', sans-serif;
}

.container {
  max-width:1100px;
  margin:auto;
  padding:30px;
}

h1 {
  font-weight:600;
  font-size:28px;
  margin-bottom:4px;
}

.subtitle {
  color:#9aa7b5;
  margin-bottom:30px;
}

.card {
  background:#111722;
  padding:24px;
  border-radius:14px;
  margin-bottom:20px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.25);
}

.section-title {
  font-size:14px;
  color:#9aa7b5;
  margin-bottom:12px;
  letter-spacing:0.5px;
}

input[type="file"] {
  margin-right:10px;
}

button {
  background:#ed1c24;
  color:white;
  border:none;
  padding:10px 16px;
  border-radius:6px;
  cursor:pointer;
  font-weight:500;
}

textarea {
  width:100%;
  background:#0d131d;
  color:white;
  border:1px solid #253040;
  border-radius:8px;
  padding:12px;
  font-family:monospace;
}

.summary {
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap:16px;
}

.metric {
  background:#0f141d;
  padding:16px;
  border-radius:10px;
}

.metric-title {
  font-size:12px;
  color:#9aa7b5;
}

.metric-value {
  font-size:22px;
  margin-top:5px;
}

table {
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th {
  text-align:left;
  font-size:12px;
  color:#9aa7b5;
  padding:10px 8px;
  border-bottom:1px solid #253040;
}

td {
  padding:12px 8px;
  border-bottom:1px solid #1c2533;
}

.green { color:#17c964; }
.red { color:#f31260; }

</style>
</head>

<body>

<div class="container">

<h1>AMD FinOps Analyzer</h1>
<div class="subtitle">Intel → AMD cost optimization</div>

<div class="card">
  <div class="section-title">UPLOAD PRICING FILE</div>
  <input type="file" id="pricing">
  <button onclick="uploadPricing()">Upload</button>
</div>

<div class="card">
  <div class="section-title">CUSTOMER USAGE</div>
  <textarea id="usage">m8i.large,10</textarea>
  <br><br>
  <button onclick="run()">Run Analysis</button>
  <button onclick="exportFile()">Download Report</button>
</div>

<div class="card">
  <div class="section-title">SUMMARY</div>
  <div class="summary">
    <div class="metric">
      <div class="metric-title">Total Current</div>
      <div class="metric-value" id="totalCurrent">$0</div>
    </div>
    <div class="metric">
      <div class="metric-title">Total AMD</div>
      <div class="metric-value" id="totalAMD">$0</div>
    </div>
    <div class="metric">
      <div class="metric-title">Savings</div>
      <div class="metric-value" id="totalSavings">$0</div>
    </div>
  </div>
</div>

<div class="card">
  <div class="section-title">RESULTS</div>
  <table id="table"></table>
</div>

</div>

<script>

async function uploadPricing(){
  let f = document.getElementById("pricing").files[0];
  let fd = new FormData();
  fd.append("file", f);

  let r = await fetch("/upload_pricing",{method:"POST",body:fd});
  let j = await r.json();

  alert("Loaded " + j.count + " rows");
}

async function run(){
  let txt = document.getElementById("usage").value.split("\n");

  let usage = txt.map(x=>{
    let p=x.split(",");
    return {instance:p[0], qty:parseInt(p[1])};
  });

  let r = await fetch("/analyze",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({usage})
  });

  let j = await r.json();

  renderTable(j.results);
  updateSummary(j);
}

function renderTable(data){
  let html = "<tr><th>Instance</th><th>Qty</th><th>AMD</th><th>Current</th><th>AMD</th><th>Savings</th><th>%</th></tr>";

  data.forEach(r=>{
    let color = r.savings > 0 ? "green" : "red";

    html += `<tr>
      <td>${r.instance}</td>
      <td>${r.qty}</td>
      <td>${r.amd}</td>
      <td>$${r.current}</td>
      <td>$${r.amd_cost}</td>
      <td class="${color}">$${r.savings}</td>
      <td class="${color}">${r.savings_pct}%</td>
    </tr>`;
  });

  document.getElementById("table").innerHTML = html;
}

function updateSummary(j){
  document.getElementById("totalCurrent").innerText = "$" + j.total_current;
  document.getElementById("totalAMD").innerText = "$" + j.total_amd;
  document.getElementById("totalSavings").innerText = "$" + j.savings;
}

function exportFile(){
  window.location="/export";
}

</script>

</body>
</html>
